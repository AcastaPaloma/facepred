# FacePred Conda Environment
# ============================
# Setup instructions:
#   1. Open Anaconda Prompt (conda shell)
#   2. cd to project directory
#   3. conda env create -f environment.yml
#   4. conda activate facepred
#
# NOTE: PyTorch installs as CPU-only via pip.
# For Colab/cloud GPU, PyTorch+CUDA comes pre-installed.

name: facepred
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.9
  - numpy>=1.26,<2.0
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - pip
  - pip:
      # Keep pip's resolver from upgrading the conda NumPy pin.
      - numpy==1.26.4
      # === Core ML ===
      - torch==2.1.2
      - torchaudio==2.1.2
      - torchvision==0.16.2
      # === Training Framework ===
      - pytorch-lightning>=2.1,<2.3
      - hydra-core>=1.3
      - omegaconf>=2.3
      - wandb
      # === Feature Extraction ===
      - mediapipe>=0.10.9,<0.11
      - opensmile>=2.5
      - pyannote.audio==3.1.1
      - pyannote.core==5.0.0
      - pyannote.database==5.1.0
      - pyannote.metrics==3.2.1
      - pyannote.pipeline==3.0.1
      - openai-whisper>=20231117
      - transformers==4.36.2
      - datasets==2.16.1
      # === Audio Processing ===
      - librosa>=0.10
      - soundfile
      - sounddevice
      # === Video Processing ===
      - opencv-python==4.9.0.80
      - opencv-contrib-python==4.9.0.80
      # === Utilities ===
      - einops>=0.7
      - rich>=13.0
      - accelerate==0.25.0
      - peft==0.7.1
      # === Code Quality ===
      - pytest>=7.4
      - ruff
