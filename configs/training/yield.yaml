# Corrected safe-yield campaign training defaults.
trainer:
  max_epochs: 50
  accelerator: auto
  devices: 1
  precision: 32
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  early_stopping:
    monitor: val/yield_average_precision_mean
    patience: 10
    mode: max
  checkpoint:
    monitor: val/yield_average_precision_mean
    mode: max
    save_top_k: 3

optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  name: cosine_warmup
  warmup_fraction: 0.05
  min_lr: 1.0e-6

dataloader:
  batch_size: 32
  num_workers: 2
  pin_memory: false
  drop_last: true
  sequence_length_s: 5.0

loss_weights:
  rssm_dynamics: 0.1
  yield: 2.0
  turn_taking: 0.5
  end_of_turn: 0.25
  dialog_act: 0.0
  affect: 0.0
  calibration: 0.1

loss_weighting: fixed

augmentation:
  modality_dropout: 0.05
  noise:
    enabled: false
  temporal_jitter:
    enabled: false
