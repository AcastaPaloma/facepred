# FacePred — Main Hydra Config
# ==============================
# Override any value via CLI: python scripts/train.py model=rssm_s training.lr=3e-4
# See configs/ subdirectories for all configurable options.

defaults:
  - model: rssm_xs
  - data: meld
  - feature: audio
  - training: default
  - _self_

# === Project ===
project:
  name: facepred
  seed: 42
  device: auto  # auto | cpu | cuda
  debug: false

# === Paths ===
paths:
  data_root: ${oc.env:FACEPRED_DATA,./data}
  feature_root: ${oc.env:FACEPRED_FEATURES,./features}
  checkpoint_dir: ${oc.env:FACEPRED_CKPT,./checkpoints}
  log_dir: ${oc.env:FACEPRED_LOGS,./logs}

# === Logging ===
logging:
  backend: wandb  # wandb | tensorboard | none
  wandb_project: facepred
  wandb_entity: null  # set to your W&B username/team
  log_every_n_steps: 10

# === Precompute / Gating ===
engine:
  precompute_k: 3
  gate_yield_threshold: 0.8
  gate_entropy_max: 0.5
  gate_margin_min: 0.3
  yield_class_index: 1  # hold=0, shift/yield=1, backchannel=2, overlap=3

# === Inference ===
inference:
  device: cpu
  features:
    - mediapipe
    - opensmile
    - whisper_tiny

# === Evaluation ===
evaluation:
  primary_metric: effective_latency
  bootstrap_samples: 10000
